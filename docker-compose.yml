services:
  tracker-worker:
    image: ghcr.io/fedifazzy/tracker-worker:latest
    ports:
      - '9091:9091'
      # Only reachable when STREAM_PORT is set; the server stays off otherwise.
      - '${STREAM_PORT:-8765}:${STREAM_PORT:-8765}'
      # qBittorrent's web interface, listening only when TORRENT_CLIENT selects
      # it. Set QBT_PASSWORD: 4.5.2 defaults to a password everyone knows.
      - '8080:8080'
    volumes:
      - type: bind
        source: ./downloads
        target: /var/www/html/wd
      - transmission-state:/var/lib/transmission-daemon
    env_file:
      - .env
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    restart: unless-stopped

volumes:
  transmission-state:
